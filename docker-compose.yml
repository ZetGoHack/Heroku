services:
  worker:
    container_name: heroku_ub
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - worker:/data
    stop_signal: SIGINT
    restart: unless-stopped
    stdin_open: true
    tty: true
    init: true

volumes:
  worker:
